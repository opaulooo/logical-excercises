<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise Playground</title>
    <link rel="stylesheet" href="styles/playground.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <p><a id="backLink" href="index.html">Back</a></p>
      <h1 id="exerciseTitle">Exercise Workspace</h1>
      <p class="meta" id="exerciseMeta"></p>
    </div>

    <div class="workspace">
      <section class="panel">
        <div class="controls">
          <div class="row">
            <div>
              <label for="language">Language</label>
              <select id="language">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="csharp">C#</option>
              </select>
            </div>
            <div>
              <label for="stdin">Input (stdin)</label>
              <input id="stdin" type="text" placeholder="Optional input for your program">
            </div>
          </div>
        </div>

        <label for="code">Code</label>
        <textarea id="code"></textarea>

        <div class="actions">
          <button class="btn-primary" id="runBtn" type="button">Run</button>
          <button class="btn-secondary" id="saveBtn" type="button">Save</button>
          <button class="btn-secondary" id="clearBtn" type="button">Clear Output</button>
        </div>

        <p class="hint">Run uses Judge0 API for JavaScript, Python and C#. If unavailable, JavaScript falls back to local execution.</p>
      </section>

      <section class="panel">
        <label>Output</label>
        <pre class="output" id="output">Ready.</pre>
        <div class="status" id="status"></div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const difficulty = (params.get('difficulty') || 'easy').toLowerCase();
      const number = params.get('number') || '00';
      const title = params.get('title') || 'Exercise';

      const languageSelect = document.getElementById('language');
      const codeEl = document.getElementById('code');
      const stdinEl = document.getElementById('stdin');
      const outputEl = document.getElementById('output');
      const statusEl = document.getElementById('status');
      const runBtn = document.getElementById('runBtn');
      const saveBtn = document.getElementById('saveBtn');
      const clearBtn = document.getElementById('clearBtn');
      const titleEl = document.getElementById('exerciseTitle');
      const metaEl = document.getElementById('exerciseMeta');
      const backLink = document.getElementById('backLink');

      const languageLabel = {
        javascript: 'JavaScript',
        python: 'Python',
        csharp: 'C#'
      };

      const languageExt = {
        javascript: 'js',
        python: 'py',
        csharp: 'cs'
      };

      const languageFolder = {
        javascript: 'js',
        python: 'python',
        csharp: 'c#'
      };

      const judge0Lang = {
        javascript: 63,
        python: 71,
        csharp: 51
      };

      const starters = {
        javascript: "function solve(input) {\n  // Write your solution here\n  return input;\n}\n\nconst input = '';\nconsole.log(solve(input));\n",
        python: "def solve(input_value):\n    # Write your solution here\n    return input_value\n\ninput_value = ''\nprint(solve(input_value))\n",
        csharp: "using System;\n\npublic class Program\n{\n    public static void Main()\n    {\n        // Write your solution here\n        Console.WriteLine(\"Hello from C#\");\n    }\n}\n"
      };

      let workspaceDirHandle = null;

      function exerciseBaseName() {
        return difficulty + '-' + number;
      }

      function storageKey(lang) {
        return 'exercise-code-' + exerciseBaseName() + '-' + lang;
      }

      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.classList.toggle('error', !!isError);
      }

      function setOutput(text) {
        outputEl.textContent = text || '';
      }

      function updateHeader() {
        const prettyDifficulty = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
        titleEl.textContent = title;
        metaEl.textContent = 'Exercise: ' + prettyDifficulty + ' #' + number + ' | Save name: ' + exerciseBaseName();

        if (['easy', 'medium', 'hard'].indexOf(difficulty) >= 0) {
          backLink.href = difficulty + '/' + difficulty + '.html';
        } else {
          backLink.href = 'index.html';
        }
      }

      function loadEditorForLanguage(lang) {
        const saved = localStorage.getItem(storageKey(lang));
        codeEl.value = saved || starters[lang] || '';
      }

      async function getWorkspaceDirHandle() {
        if (!window.showDirectoryPicker) {
          return null;
        }

        if (workspaceDirHandle) {
          return workspaceDirHandle;
        }

        workspaceDirHandle = await window.showDirectoryPicker({
          id: 'logical-exercises-root',
          mode: 'readwrite'
        });

        return workspaceDirHandle;
      }

      async function saveUsingFileSystemAccess(folderName, fileName, code) {
        const rootHandle = await getWorkspaceDirHandle();
        if (!rootHandle) {
          return null;
        }

        const folderHandle = await rootHandle.getDirectoryHandle(folderName, { create: true });
        const fileHandle = await folderHandle.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(code);
        await writable.close();

        return folderName + '/' + fileName;
      }

      function downloadFallback(folderName, fileName, code) {
        const suggestedName = folderName + '-' + fileName;
        const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = suggestedName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        return suggestedName;
      }

      async function saveCurrentCode() {
        const lang = languageSelect.value;
        const baseName = exerciseBaseName();
        const ext = languageExt[lang] || 'txt';
        const folderName = languageFolder[lang] || 'misc';
        const fileName = baseName + '.' + ext;
        const code = codeEl.value;

        localStorage.setItem(storageKey(lang), code);

        try {
          const savedPath = await saveUsingFileSystemAccess(folderName, fileName, code);
          if (savedPath) {
            setStatus('Saved in project folder: ' + savedPath, false);
            return;
          }

          const downloadedName = downloadFallback(folderName, fileName, code);
          setStatus('Browser does not support direct folder write. Downloaded as ' + downloadedName + '.', false);
        } catch (error) {
          if (error && error.name === 'AbortError') {
            setStatus('Save cancelled.', true);
            return;
          }

          const downloadedName = downloadFallback(folderName, fileName, code);
          setStatus('Could not write directly to folder. Downloaded as ' + downloadedName + '.', true);
        }
      }

      async function runWithJudge0(lang, sourceCode, stdin) {
        const languageId = judge0Lang[lang];
        if (!languageId) {
          throw new Error('Unsupported language for Judge0 execution.');
        }

        const response = await fetch('https://ce.judge0.com/submissions?base64_encoded=false&wait=true', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            language_id: languageId,
            source_code: sourceCode,
            stdin: stdin || ''
          })
        });

        if (!response.ok) {
          throw new Error('Judge0 request failed with status ' + response.status);
        }

        return response.json();
      }

      function runJavaScriptLocally(sourceCode, stdin) {
        const captured = [];
        const originalLog = console.log;
        const originalError = console.error;

        console.log = function () {
          captured.push(Array.from(arguments).join(' '));
        };

        console.error = function () {
          captured.push(Array.from(arguments).join(' '));
        };

        try {
          const runner = new Function('stdin', sourceCode);
          const result = runner(stdin || '');
          if (typeof result !== 'undefined') {
            captured.push(String(result));
          }
        } finally {
          console.log = originalLog;
          console.error = originalError;
        }

        return captured.join('\n') || '(no output)';
      }

      async function runCode() {
        const lang = languageSelect.value;
        const sourceCode = codeEl.value;
        const stdin = stdinEl.value;

        setStatus('Running...', false);
        setOutput('');

        try {
          const result = await runWithJudge0(lang, sourceCode, stdin);
          const output = result.stdout || result.stderr || result.compile_output || result.message || result.status && result.status.description || '(no output)';
          setOutput(output);
          setStatus('Execution finished via Judge0.', false);
        } catch (error) {
          if (lang === 'javascript') {
            try {
              const localOutput = runJavaScriptLocally(sourceCode, stdin);
              setOutput(localOutput);
              setStatus('Judge0 unavailable. Executed locally in browser (JavaScript).', false);
              return;
            } catch (localError) {
              setOutput(String(localError));
              setStatus('Execution failed.', true);
              return;
            }
          }

          setOutput(String(error));
          setStatus('Execution failed. Check network/API availability and try again.', true);
        }
      }

      languageSelect.addEventListener('change', function () {
        loadEditorForLanguage(languageSelect.value);
      });

      runBtn.addEventListener('click', runCode);
      saveBtn.addEventListener('click', saveCurrentCode);
      clearBtn.addEventListener('click', function () {
        setOutput('');
        setStatus('Output cleared.', false);
      });

      updateHeader();
      loadEditorForLanguage(languageSelect.value);
    })();
  </script>
</body>
</html>
