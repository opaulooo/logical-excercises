<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise Playground</title>
    <link rel="stylesheet" href="styles/playground.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <p><a id="backLink" href="index.html">Back</a></p>
        <h1 id="exerciseTitle">Exercise Workspace</h1>
        <p class="meta" id="exerciseMeta"></p>
        <p class="meta" id="exerciseDescription"></p>
      </div>

      <div class="workspace">
        <section class="panel">
          <div class="controls">
            <div class="row">
              <div>
                <label for="language">Language</label>
                <select id="language">
                  <option value="javascript">JavaScript</option>
                  <option value="python">Python</option>
                  <option value="csharp">C#</option>
                </select>
              </div>
              <div>
                <label for="stdin" class="label-with-help">
                  <span>Input (stdin)</span>
                  <span
                    class="help-dot"
                    tabindex="0"
                    aria-label="Use o terminal abaixo para enviar entrada. Se digitar com ponto e virgula (;), os valores sao enviados em sequencia de linhas para o stdin."
                    data-tooltip="Use o terminal abaixo para enviar entrada. Se digitar com ';', os valores sao enviados em sequencia para o stdin."
                    >i</span
                  >
                </label>
                <input
                  id="stdin"
                  type="text"
                  placeholder="Optional input for your program"
                />
              </div>
            </div>
          </div>

          <div class="action-run">
            <button class="btn-primary" id="runBtn" type="button">Run</button>
          </div>

          <label for="code">Code</label>
          <div id="codeEditor" aria-label="Code editor"></div>
          <textarea
            id="code"
            class="code-fallback"
            aria-label="Code fallback editor"
          ></textarea>

          <div class="actions">
            <button class="btn-secondary" id="saveBtn" type="button">
              Save
            </button>
            <button class="btn-secondary" id="saveAsBtn" type="button">
              Save As
            </button>
          </div>

          <p class="hint">
            Run uses Judge0 API for JavaScript, Python and C#. If unavailable,
            JavaScript falls back to local execution.
          </p>
        </section>

        <section class="panel">
          <div class="output-header">
            <label>Output</label>
            <div class="output-actions">
              <button class="btn-secondary" id="finalizeBtn" type="button">
                Finalizar
              </button>
              <button class="btn-secondary" id="clearBtn" type="button">
                Clear Output
              </button>
            </div>
          </div>
          <div class="avg-time" id="avgTime">tempo medio: - s</div>
          <pre class="output" id="output">Ready.</pre>
          <div class="status" id="status"></div>
        </section>
      </div>
    </div>

    <script src="playground.js"></script>
  </body>
</html>
